name: ytmusicapi_dart
description: Unofficial API client for YouTube Music. Inspired by sigma67's ytmusicapi for Python.
version: 3.0.0-rc.1
repository: https://github.com/encrystudio/ytmusicapi_dart
homepage: https://encrystudio.github.io/ytmusicapi_dart

environment:
  sdk: ^3.7.2

dev_dependencies:
  curl_dio_logger_interceptor: ^0.0.2
  lint: ^2.14.0
  lints: ^6.1.0
  test: ^1.32.0

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.1
  dio_http2_adapter: ^2.9.0
  intl: ^0.20.3
  open_url: ^2.0.1
  unorm_dart: ^0.3.2

topics:
  - api
  - cross-platform
  - client
  - youtube-api
  - youtube

false_secrets: 
  - /lib/constants.dart
